# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/HISP-Uganda/mfl-integrator/buildinfo.Version={{ .Version }} -X github.com/HISP-Uganda/mfl-integrator/buildinfo.BuildNumber={{ .Env.BUILD_NUMBER }} -X github.com/HISP-Uganda/mfl-integrator/buildinfo.Commit={{ .Commit }} -X github.com/HISP-Uganda/mfl-integrator/buildinfo.BuildDate={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
archives:
  # - replacements:
  #     darwin: Darwin
  #     linux: Linux
  #     windows: Windows
  #     386: i386
  #     amd64: x86_64
  - files:
      - README.md
      - docs/**/*
      - docs/*.yml
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Version }}"
changelog:
  sort: asc
  filters:
    exclude:
      - '^test:'
